<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 250" width="1000" height="250" font-family="-apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif">
<title>Devendra Yadav - DevOps Engineer</title>
<defs>
<pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.3" fill="#d0d7de"/></pattern>
<linearGradient id="fade" x1="0" x2="1"><stop offset="0" stop-color="#fff" stop-opacity="1"/><stop offset=".55" stop-color="#fff" stop-opacity=".9"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
<mask id="m"><rect width="1000" height="250" fill="url(#fade)" transform="translate(1000,0) scale(-1,1)"/></mask>
<clipPath id="typ"><rect class="typ" x="76" y="198" width="521" height="26"/></clipPath>
</defs>
<style>
.name{animation:up .8s cubic-bezier(.2,.8,.2,1) both}
.role{animation:up .8s .2s cubic-bezier(.2,.8,.2,1) both}
@keyframes up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.tag{animation:fade .5s both}@keyframes fade{from{opacity:0}to{opacity:1}}
.typ{animation:ty 8s steps(56,end) infinite}
@keyframes ty{0%{width:0}55%{width:521px}92%{width:521px}100%{width:0}}
.cur{animation:cu 8s steps(56,end) infinite}
@keyframes cu{0%{transform:translateX(0)}55%{transform:translateX(521px)}92%{transform:translateX(521px)}100%{transform:translateX(0)}}
.blink{animation:bl 1s steps(1) infinite}@keyframes bl{50%{opacity:0}}
</style>
<rect x=".5" y=".5" width="999" height="249" rx="14" fill="#fff" stroke="#d0d7de"/>
<g mask="url(#m)"><rect x="500" y="1" width="499" height="248" fill="url(#dots)"/></g>
<rect x="48" y="44" width="40" height="4" rx="2" fill="#0969da"/>
<text class="name" x="48" y="106" font-size="54" font-weight="700" fill="#1f2328" letter-spacing="-1">Devendra Yadav</text>
<text class="role" x="49" y="136" font-size="20" fill="#57606a">DevOps Engineer  ·  Cloud Automation  ·  CI/CD  ·  DevSecOps</text>
<g class="tag" style="animation-delay:0.5s"><rect x="48" y="150" width="54" height="30" rx="15" fill="#fff" stroke="#d0d7de"/><text x="75" y="170" text-anchor="middle" font-size="14" font-weight="600" fill="#1f2328">AWS</text></g><g class="tag" style="animation-delay:0.6s"><rect x="111.8" y="150" width="114" height="30" rx="15" fill="#fff" stroke="#d0d7de"/><text x="169" y="170" text-anchor="middle" font-size="14" font-weight="600" fill="#1f2328">Kubernetes</text></g><g class="tag" style="animation-delay:0.7s"><rect x="235.8" y="150" width="105" height="30" rx="15" fill="#fff" stroke="#d0d7de"/><text x="288" y="170" text-anchor="middle" font-size="14" font-weight="600" fill="#1f2328">Terraform</text></g><g class="tag" style="animation-delay:0.8s"><rect x="351.2" y="150" width="71" height="30" rx="15" fill="#fff" stroke="#d0d7de"/><text x="387" y="170" text-anchor="middle" font-size="14" font-weight="600" fill="#1f2328">CI/CD</text></g><g class="tag" style="animation-delay:0.9s"><rect x="432.2" y="150" width="105" height="30" rx="15" fill="#fff" stroke="#d0d7de"/><text x="485" y="170" text-anchor="middle" font-size="14" font-weight="600" fill="#1f2328">DevSecOps</text></g>
<rect x="48" y="192" width="520" height="38" rx="8" fill="#f6f8fa" stroke="#d0d7de"/>
<text x="62" y="216" font-family="'SF Mono','Fira Code','Consolas','Courier New',monospace" font-size="14" fill="#0969da">$</text>
<g clip-path="url(#typ)"><text x="76" y="216" font-family="'SF Mono','Fira Code','Consolas','Courier New',monospace" font-size="14" fill="#1f2328" textLength="521" lengthAdjust="spacingAndGlyphs">kubectl rollout status deploy/app  --  deployed, zero downtime</text></g>
<g class="cur"><rect class="blink" x="77" y="202" width="8" height="18" fill="#0969da"/></g>
</svg>