<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 190" width="1000" height="190" font-family="'Segoe UI',-apple-system,'Helvetica Neue',Arial,sans-serif">
<title>Impact</title>
<style>
.card{animation:up .7s cubic-bezier(.2,.8,.2,1) both}
@keyframes up{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
.bar{transform-box:fill-box;transform-origin:left center;animation:grow 1.4s cubic-bezier(.2,.8,.2,1) both}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.dot{animation:dp .4s cubic-bezier(.2,1.6,.4,1) both;transform-box:fill-box;transform-origin:center}
@keyframes dp{from{opacity:0;transform:scale(0)}to{opacity:1;transform:scale(1)}}
</style>
<defs><linearGradient id="g0" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4f46e5"/><stop offset="1" stop-color="#7c3aed"/></linearGradient></defs><g class="card" style="animation-delay:0.00s"><rect x="0" y="0" width="235" height="190" rx="20" fill="url(#g0)"/><circle cx="205" cy="30" r="70" fill="#fff" fill-opacity=".10"/><text x="22" y="78" font-size="54" font-weight="800" fill="#fff">10+</text><text x="22" y="108" font-size="15" font-weight="600" fill="#fff">Applications onboarded</text><text x="22" y="128" font-size="15" font-weight="600" fill="#fff">to Amazon EKS</text><circle class="dot" style="animation-delay:0.8s" cx="28" cy="160" r="6" fill="#fff"/><circle class="dot" style="animation-delay:0.9s" cx="48" cy="160" r="6" fill="#fff"/><circle class="dot" style="animation-delay:1.0s" cx="68" cy="160" r="6" fill="#fff"/><circle class="dot" style="animation-delay:1.1s" cx="88" cy="160" r="6" fill="#fff"/><circle class="dot" style="animation-delay:1.2s" cx="108" cy="160" r="6" fill="#fff"/><circle class="dot" style="animation-delay:1.3s" cx="128" cy="160" r="6" fill="#fff"/><circle class="dot" style="animation-delay:1.4s" cx="148" cy="160" r="6" fill="#fff"/><circle class="dot" style="animation-delay:1.5s" cx="168" cy="160" r="6" fill="#fff"/><circle class="dot" style="animation-delay:1.6s" cx="188" cy="160" r="6" fill="#fff"/><circle class="dot" style="animation-delay:1.7s" cx="208" cy="160" r="6" fill="#fff"/></g><defs><linearGradient id="g1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#db2777"/><stop offset="1" stop-color="#f43f5e"/></linearGradient></defs><g class="card" style="animation-delay:0.15s"><rect x="255" y="0" width="235" height="190" rx="20" fill="url(#g1)"/><circle cx="460" cy="30" r="70" fill="#fff" fill-opacity=".10"/><text x="277" y="78" font-size="54" font-weight="800" fill="#fff">60%</text><text x="277" y="108" font-size="15" font-weight="600" fill="#fff">Less manual deployment</text><text x="277" y="128" font-size="15" font-weight="600" fill="#fff">effort</text><rect x="277" y="152" width="191" height="10" rx="5" fill="#fff" fill-opacity=".28"/><rect class="bar" style="animation-delay:0.75s" x="277" y="152" width="114.6" height="10" rx="5" fill="#fff"/></g><defs><linearGradient id="g2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ea580c"/><stop offset="1" stop-color="#f59e0b"/></linearGradient></defs><g class="card" style="animation-delay:0.30s"><rect x="510" y="0" width="235" height="190" rx="20" fill="url(#g2)"/><circle cx="715" cy="30" r="70" fill="#fff" fill-opacity=".10"/><text x="532" y="78" font-size="54" font-weight="800" fill="#fff">15%</text><text x="532" y="108" font-size="15" font-weight="600" fill="#fff">Higher deployment</text><text x="532" y="128" font-size="15" font-weight="600" fill="#fff">success</text><rect x="532" y="152" width="191" height="10" rx="5" fill="#fff" fill-opacity=".28"/><rect class="bar" style="animation-delay:0.90s" x="532" y="152" width="28.6" height="10" rx="5" fill="#fff"/></g><defs><linearGradient id="g3" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0891b2"/><stop offset="1" stop-color="#2563eb"/></linearGradient></defs><g class="card" style="animation-delay:0.45s"><rect x="765" y="0" width="235" height="190" rx="20" fill="url(#g3)"/><circle cx="970" cy="30" r="70" fill="#fff" fill-opacity=".10"/><text x="787" y="78" font-size="54" font-weight="800" fill="#fff">30%</text><text x="787" y="108" font-size="15" font-weight="600" fill="#fff">Faster critical CVE</text><text x="787" y="128" font-size="15" font-weight="600" fill="#fff">remediation</text><rect x="787" y="152" width="191" height="10" rx="5" fill="#fff" fill-opacity=".28"/><rect class="bar" style="animation-delay:1.05s" x="787" y="152" width="57.3" height="10" rx="5" fill="#fff"/></g>
