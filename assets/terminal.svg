<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" width="1000" height="420">
<title>A day in my terminal</title>
<defs><linearGradient id="tb" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#1e1b4b"/><stop offset="1" stop-color="#312e81"/></linearGradient></defs>
<style>
text{font-family:'Fira Code','JetBrains Mono','Consolas','Courier New',monospace;font-size:15px}
.ln{opacity:0;animation:in .5s forwards}
@keyframes in{from{opacity:0;transform:translateX(-8px)}to{opacity:1;transform:none}}
.cur{animation:bl 1s steps(1) infinite 7s;opacity:0}@keyframes bl{0%{opacity:1}50%{opacity:0}100%{opacity:1}}
</style>
<rect width="1000" height="420" rx="16" fill="#0f172a"/>
<path d="M0 16a16 16 0 0 1 16-16h968a16 16 0 0 1 16 16v28H0z" fill="url(#tb)"/>
<circle cx="28" cy="22" r="7" fill="#ff5f56"/><circle cx="52" cy="22" r="7" fill="#ffbd2e"/><circle cx="76" cy="22" r="7" fill="#27c93f"/>
<text x="500" y="27" text-anchor="middle" fill="#c7d2fe" style="font-family:'Segoe UI',-apple-system,'Helvetica Neue',Arial,sans-serif;font-size:13px">devendra@prod-eks: ~</text>
<text class="ln" style="animation-delay:0s" x="28" y="92" fill="#e5e7eb" xml:space="preserve">$ kubectl get pods -n production</text><text class="ln" style="animation-delay:0.9s" x="28" y="116" fill="#94a3b8" xml:space="preserve">NAME                       READY   STATUS    RESTARTS   AGE</text><text class="ln" style="animation-delay:1.2s" x="28" y="140" fill="#86efac" xml:space="preserve">payments-api-7d9f8c6b-x2k  1/1     Running   0          14d</text><text class="ln" style="animation-delay:1.5s" x="28" y="164" fill="#86efac" xml:space="preserve">orders-svc-5c8b7d9f-p9q    1/1     Running   0          14d</text><text class="ln" style="animation-delay:1.8s" x="28" y="188" fill="#86efac" xml:space="preserve">frontend-6b7f9d8c-m4z      1/1     Running   0          14d</text><text class="ln" style="animation-delay:2.6s" x="28" y="236" fill="#e5e7eb" xml:space="preserve">$ ./ship-it --scan --sign --deploy</text><text class="ln" style="animation-delay:3.5s" x="28" y="260" fill="#67e8f9" xml:space="preserve">[ok] Xray + Twistlock scan ........ clean</text><text class="ln" style="animation-delay:4.0s" x="28" y="284" fill="#67e8f9" xml:space="preserve">[ok] Image signed ................. done</text><text class="ln" style="animation-delay:4.5s" x="28" y="308" fill="#67e8f9" xml:space="preserve">[ok] Argo CD sync ................. healthy</text><text class="ln" style="animation-delay:5.4s" x="28" y="356" fill="#e5e7eb" xml:space="preserve">$ echo $VIBES</text><text class="ln" style="animation-delay:6.2s" x="28" y="380" fill="#fde047" xml:space="preserve">immaculate</text>
<rect class="cur" x="28" y="366" width="9" height="18" fill="#fde047" transform="translate(92,0)"/>
</svg>