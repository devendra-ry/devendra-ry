<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" width="1000" height="420">
<title>A day in my terminal</title>
<style>text{font-family:'SF Mono','Fira Code','Consolas','Courier New',monospace;font-size:15px}.ln{opacity:0;animation:in .4s forwards}@keyframes in{from{opacity:0;transform:translateX(-6px)}to{opacity:1;transform:none}}
.cur{opacity:0;animation:bl 1s steps(1) infinite 6.8s}@keyframes bl{0%{opacity:1}50%{opacity:0}100%{opacity:1}}</style>
<rect width="1000" height="420" rx="12" fill="#0d1117"/>
<path d="M0 12a12 12 0 0 1 12-12h976a12 12 0 0 1 12 12v32H0z" fill="#161b22"/><rect y="43" width="1000" height="1" fill="#30363d"/>
<circle cx="28" cy="22" r="6" fill="#484f58"/><circle cx="50" cy="22" r="6" fill="#484f58"/><circle cx="72" cy="22" r="6" fill="#484f58"/>
<text x="500" y="27" text-anchor="middle" fill="#8b949e" style="font-family:-apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;font-size:13px">devendra@prod-eks: ~</text>
<text class="ln" style="animation-delay:0s" x="28" y="92" fill="#e6edf3" xml:space="preserve">$ kubectl get pods -n production</text><text class="ln" style="animation-delay:0.8s" x="28" y="116" fill="#8b949e" xml:space="preserve">NAME                       READY   STATUS    RESTARTS   AGE</text><text class="ln" style="animation-delay:1.1s" x="28" y="140" fill="#7ee787" xml:space="preserve">payments-api-7d9f8c6b-x2k  1/1     Running   0          14d</text><text class="ln" style="animation-delay:1.4s" x="28" y="164" fill="#7ee787" xml:space="preserve">orders-svc-5c8b7d9f-p9q    1/1     Running   0          14d</text><text class="ln" style="animation-delay:1.7s" x="28" y="188" fill="#7ee787" xml:space="preserve">frontend-6b7f9d8c-m4z      1/1     Running   0          14d</text><text class="ln" style="animation-delay:2.5s" x="28" y="236" fill="#e6edf3" xml:space="preserve">$ ./ship-it --scan --sign --deploy</text><text class="ln" style="animation-delay:3.3s" x="28" y="260" fill="#79c0ff" xml:space="preserve">[ok] Xray + Twistlock scan ........ clean</text><text class="ln" style="animation-delay:3.8s" x="28" y="284" fill="#79c0ff" xml:space="preserve">[ok] Image signed ................. done</text><text class="ln" style="animation-delay:4.3s" x="28" y="308" fill="#79c0ff" xml:space="preserve">[ok] Argo CD sync ................. healthy</text><text class="ln" style="animation-delay:5.2s" x="28" y="356" fill="#e6edf3" xml:space="preserve">$ echo $VIBES</text><text class="ln" style="animation-delay:6.0s" x="28" y="380" fill="#e3b341" xml:space="preserve">immaculate</text>
<rect class="cur" x="119" y="366" width="9" height="18" fill="#e3b341"/>
</svg>