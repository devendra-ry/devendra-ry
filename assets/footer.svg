<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 120" width="1000" height="120" font-family="-apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif">
<title>Thanks for stopping by</title>
<style>.blink{animation:bl 1s steps(1) infinite}@keyframes bl{50%{opacity:0}}</style>
<rect x=".5" y=".5" width="999" height="119" rx="14" fill="#f6f8fa" stroke="#d0d7de"/>
<rect x="470" y="28" width="60" height="3" rx="1.5" fill="#0969da"/>
<text x="500" y="66" text-anchor="middle" font-family="'SF Mono','Fira Code','Consolas','Courier New',monospace" font-size="20" font-weight="600" fill="#1f2328">while true; do ship --safely; done<tspan class="blink" fill="#0969da">_</tspan></text>
<text x="500" y="94" text-anchor="middle" font-size="14" fill="#57606a">Thanks for stopping by. May your pods always be Running.</text>
</svg>